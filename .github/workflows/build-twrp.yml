# XTC i28 (sp9820e_xtc_i28) TWRP —— KitKat 老源码专用通道
#
# 配方来自 TuberMain/Action-TWRP-Builder 的 "Recovery Build (Ubuntu 18.04)"，
# 该分支就是作者为 KitKat / Lollipop 老设备准备的（Ubuntu 18.04 容器 + GLIBC 2.28 + Python2 + JDK8）。
# 本文件在它的基础上：
#   - 预填好 i28 的全部参数（原版自动推导会把 sp9820e_xtc_i28 拆错）
#   - MANIFEST 指向真实存在的 twrp-4.4-deprecated 分支
#   - 修掉 .dependencies 路径取空的问题
#   - 额外用 upload-artifact 保底（Release 挂了也能拿到镜像）
name: Build TWRP (KitKat / Legacy)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'omni manifest 分支（不确定就用默认）'
        required: true
        default: 'twrp-4.4-deprecated'
        type: choice
        options:
          - twrp-4.4-deprecated
          - twrp-5.1
          - twrp-7.1
      fresh_ccache:
        description: '丢弃 ccache 缓存，全新编译'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner 标签（更大核数更快；self-hosted 见 README）'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
      BUILD_TARGET:
        description: '编译目标分区'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni
  DEVICE_TREE_URL: https://github.com/TuberMain/twrp_device_sp9820e_xtc_i28
  DEVICE_TREE_BRANCH: twrp-4.4
  DEVICE_PATH: device/xtc/sp9820e_xtc_i28
  DEVICE_NAME: sp9820e_xtc_i28
  MAKEFILE_NAME: omni_sp9820e_xtc_i28

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/catthehacker/ubuntu:runner-18.04
    env:
      LC_ALL: "C.UTF-8"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::Run Parameters"
        echo "Manifest    : ${{ env.MANIFEST_URL }} @ ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device tree : ${{ env.DEVICE_TREE_URL }} @ ${{ env.DEVICE_TREE_BRANCH }}"
        echo "Device path : ${{ env.DEVICE_PATH }}"
        echo "Device name : ${{ env.DEVICE_NAME }}"
        echo "Makefile    : ${{ env.MAKEFILE_NAME }}"
        echo "Target      : ${{ inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt install libc6
        sudo apt -y upgrade
        # ccache 必须装：下面会把它链到 prebuilts/misc/<tag>/ccache/ccache 给 KitKat 构建系统用
        sudo apt install -yq aptitude bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
          libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
          rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python bash tmux

    - name: Upgrade GLIBC to 2.28
      run: |
        sudo sed -i '$a deb http://archive.debian.org/debian-security buster/updates main' /etc/apt/sources.list
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 112695A0E562B32A 54404762BBB6E853
        sudo apt update
        sudo apt install libc6 -y
        sudo sed -i '$d' /etc/apt/sources.list

    - name: Check Out
      uses: actions/checkout@v4

    - name: 恢复 ccache
      if: ${{ inputs.fresh_ccache == false }}
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-kitkat-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-kitkat-${{ inputs.MANIFEST_BRANCH }}-
    - name: Install OpenJDK 7
      continue-on-error: true
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '7'

    - name: Install repo
      run: |
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Py-Ctrl"
        git config --global user.email "actions@users.noreply.github.com"
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}

    - name: 补 minimal manifest 剥掉的模块
      run: |
        mkdir -p .repo/local_manifests
        cat > .repo/local_manifests/extra.xml <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <!-- minimal manifest 剥掉了 mksh，但 KitKat 的 build 需要它生成 /system/bin/sh -->
          <!-- 不写 remote/revision 即继承 default: aosp @ refs/tags/android-4.4.4_r1（原版 KitKat） -->
          <project path="external/mksh" name="platform/external/mksh" />
        </manifest>
        EOF
        cat .repo/local_manifests/extra.xml
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync > "${{ steps.pwd.outputs.workspace-folder }}/sync.log" 2>&1 \
          || { echo "===== repo sync 失败，最后 80 行 ====="; tail -n 80 "${{ steps.pwd.outputs.workspace-folder }}/sync.log"; exit 1; }
        tail -n 20 "${{ steps.pwd.outputs.workspace-folder }}/sync.log"
        df -h /
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        git clone ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
        ls -l ${{ env.DEVICE_PATH }}
        # AOSP 4.4 的 build/core/Makefile 只 wildcard recovery/res，不会拷 recovery/root；
        # 而设备树的 device.mk 是空的 => ramdisk 里缺设备专属 rc => TWRP 卡第一屏。
        # 官方 D3TWRP.img 里有这两个文件，所以这里由 CI 显式补 PRODUCT_COPY_FILES。
        MK="${{ env.DEVICE_PATH }}/device.mk"
        {
          echo ""
          echo "# --- CI 注入：把 recovery/root 下的设备专属 rc 送进 PRODUCT_OUT/root ---"
          echo "PRODUCT_COPY_FILES += \\"
          echo "    \$(LOCAL_PATH)/recovery/root/init.recovery.sp9820e_xtc_i28.rc:root/init.recovery.sp9820e_xtc_i28.rc \\"
          echo "    \$(LOCAL_PATH)/recovery/root/ueventd.sp9820e_xtc_i28.rc:root/ueventd.sp9820e_xtc_i28.rc"
        } >> "$MK"
        echo '--- device.mk 追加后（尾部 6 行）---'
        tail -n 6 "$MK"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync Device Dependencies
      continue-on-error: true
      run: |
        DEP="${{ env.DEVICE_PATH }}/omni.dependencies"
        if [ -f "$DEP" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEP"
          repo sync -j$(nproc --all)
        else
          echo "[i] 设备树没有 omni.dependencies，跳过依赖同步"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Switch to Python2
      continue-on-error: true
      run: |
        sudo rm -f /usr/bin/python /usr/bin/python3.6 /usr/bin/python3.6m /usr/local/bin/python
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python

    - name: 预打 init.c 补丁（放宽 fuzz，失败也不阻断）
      continue-on-error: true
      run: |
        # 设备树的 vendorsetup.sh 里有一句 patch -Np1，hunk 对不上时在 bash -e 下会直接杀掉 lunch。
        # 这里先自己用 --fuzz=5 打一遍：打上了，vendorsetup 里那句 -N 会自动跳过。
        # 打不上也没关系 —— 该补丁只是强制关闭 SELinux，内核没开 SELinux 时 init 本来就走 disabled 分支。
        patch -p1 --fuzz=5 --forward < "${{ env.DEVICE_PATH }}/init.c.patch"           && echo "[+] init.c 补丁已打上（SELinux 强制关闭）"           || echo "[i] init.c.patch 没打上，跳过（不影响构建）"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Java 版本兜底（拿不到 JDK7 就放宽 main.mk 检查）
      run: |
        java -version 2>&1 | head -n 1
        # Zulu/OpenJDK 新版首行是 "openjdk version "1.7.0_352""，而 KitKat 的正则要求行首是 "java "，
        # 所以哪怕装对了 JDK7 也会被判为版本不符。两处都放宽：
        #   1) 版本号 1.6/1.7 -> 1.6/1.7/1.8
        #   2) 去掉 java_version 那行的 ^java 行首锚定
        sed -i 's/1\\\.\[67\]/1\\\.\[678\]/g' build/core/main.mk
        sed -i '155s/\^java //' build/core/main.mk
        echo "--- 改后 ---"
        grep -n 'java_version :=\|javac_version :=' build/core/main.mk
        echo "--- 实跑校验 ---"
        java -version 2>&1 | head -n 1 | grep '.*[ "]1\.[678][\. "$]'           && echo "[OK] java 版本检查会通过" || echo "[!] 仍会被拦"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 把 ccache 链到 prebuilts/misc（KitKat 只认这个路径）
      run: |
        # build/core/combo/select.mk:88 会去找
        #   prebuilts/misc/<HOST_PREBUILT_TAG>/ccache/ccache
        # 找不到就 wildcard 为空 → ccache 静默失效（不报错），所以必须补上。
        for tag in linux-x86 linux-x86_64; do
          d="prebuilts/misc/$tag/ccache"
          mkdir -p "$d"
          if [ -e "$d/ccache" ]; then
            echo "[i] $d/ccache 已存在（用 manifest 自带的）"
          else
            ln -sf "$(command -v ccache)" "$d/ccache"
            echo "[+] 已链到 $d/ccache"
          fi
        done
        # bionic 自带的 ccache 3.4.1 不认 CCACHE_MAXSIZE 环境变量（实测显示仍是 1.0GB），必须显式 -M
        ccache -M 5G
        command -v ccache && ccache --version | head -n 1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        # twrp-5.1 源码需要这个补丁
        if [ "${{ inputs.MANIFEST_BRANCH }}" == "twrp-5.1" ]; then
          patch -p1 < ../patches/partition.cpp.patch
        fi
        # 用 || true 兜住：vendorsetup.sh 里的 patch 失败时不能让 errexit 把整个步骤杀掉
        source build/envsetup.sh || true
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        lunch ${{ env.MAKEFILE_NAME }}-eng || { echo "[!] lunch 失败"; exit 1; }
        make clean
        make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "=== ccache 统计（命中越多，下次越快）==="
        ccache -s || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 校验 ramdisk 含设备专属 rc（防回归）
      run: |
        # 18.04 容器里第 15 步「Switch to Python2」会把 /usr/bin/python3.6 删掉
        # （那就是 python3 本体），所以不能写死 python3，用哪个存在就用哪个
        PY=python
        command -v python3 >/dev/null 2>&1 && PY=python3
        echo "using: $PY ($($PY --version 2>&1))"
        "$PY" ${GITHUB_WORKSPACE}/scripts/check_ramdisk.py \
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 触摸驱动自检（dtb 有没有打进镜像）
      continue-on-error: true
      run: |
        IMG=workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        ls -l "$IMG"
        echo "=== boot header ==="
        echo "magic     : $(head -c 8 "$IMG")"
        echo "kernel_sz : $(od -An -tu4 -j8  -N4 "$IMG" | tr -d ' ')"
        echo "ramdisk_sz: $(od -An -tu4 -j16 -N4 "$IMG" | tr -d ' ')"
        echo "dt_size   : $(od -An -tu4 -j40 -N4 "$IMG" | tr -d ' ')"
        echo "=== 关键字符串（grep -a 直接扫二进制，不用 strings，避免 SIGPIPE）==="
        echo "cyttsp5      : $(grep -a -o cyttsp5         "$IMG" | wc -l) 处"
        echo "tsc@24       : $(grep -a -o 'tsc@24'        "$IMG" | wc -l) 处"
        echo "Linux version: $(grep -a -o 'Linux version' "$IMG" | wc -l) 处"
        DT=$(od -An -tu4 -j40 -N4 "$IMG" | tr -d ' ')
        CY=$(grep -a -o cyttsp5 "$IMG" | wc -l)
        TS=$(grep -a -o 'tsc@24' "$IMG" | wc -l)
        if [ "${DT:-0}" -gt 0 ] && [ "${CY:-0}" -gt 0 ] && [ "${TS:-0}" -gt 0 ]; then
          echo "[+] 触摸 OK：dtb 已打包(${DT} 字节)，镜像内含 cyttsp5 与 tsc@24 节点"
        else
          echo "::warning::dt_size=${DT} cyttsp5=${CY} tsc@24=${TS} —— 请核对 BOARD_MKBOOTIMG_ARGS 的 --dt"
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        name: ${{ env.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_URL }} @ ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Device tree: ${{ env.DEVICE_TREE_URL }} @ ${{ env.DEVICE_TREE_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact (保底)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ github.run_number }}
        path: workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        if-no-files-found: warn
        retention-days: 30
