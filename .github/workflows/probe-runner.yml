# 探一下 GitHub 托管 runner 到底给了多少 CPU / 内存 / 磁盘
name: Probe Runner Specs

on:
  workflow_dispatch:

jobs:
  host:
    name: 宿主 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Specs
        run: |
          echo "=== CPU ==="
          echo "nproc        : $(nproc)"
          echo "nproc --all  : $(nproc --all)"
          echo "getconf      : $(getconf _NPROCESSORS_ONLN)"
          lscpu 2>/dev/null | grep -iE '^(CPU\(s\)|Model name|Thread|Core|Socket|CPU max MHz)' || true
          echo "=== 内存 ==="
          free -h
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 谁在跑 ==="
          uname -a

  container:
    name: 容器内 (ubuntu 18.04, 编译实际发生的地方)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:runner-18.04
      volumes:
        - /:/host_root
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Specs
        shell: bash
        run: |
          echo "nproc        : $(nproc)"
          echo "nproc --all  : $(nproc --all)"
          free -h
          df -h /
          cat /etc/os-release | head -n 2
