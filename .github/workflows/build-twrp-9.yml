# XTC i28 (sp9820e_xtc_i28) —— TWRP 3.7.0_9
# 3.7.0_9 只能由 twrp-9.0 manifest 编出；twrp-4.4-deprecated 编的 3.1 会卡第一屏。
# 触摸：TW_SCREEN_BLANK_ON_BOOT 会让 ADF 给 cyttsp5 发 POWERDOWN，IC 睡死后 I2C 全 -62。
name: Build TWRP 3.7 (Android 9.0)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'twrp-4.4'
        type: choice
        options:
          - twrp-4.4
      runner:
        description: 'Runner 标签'
        required: true
        default: 'ubuntu-22.04'
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-latest
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
      BUILD_TARGET:
        description: '编译目标分区'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
      DISABLE_BLANK:
        description: '关闭启动黑屏（触摸修复，必须 true）'
        required: true
        default: true
        type: boolean
      fresh_ccache:
        description: '丢弃 ccache 缓存'
        required: false
        default: false
        type: boolean

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni
  MANIFEST_BRANCH: twrp-9.0
  DEVICE_TREE_URL: https://github.com/TuberMain/twrp_device_sp9820e_xtc_i28
  DEVICE_PATH: device/xtc/sp9820e_xtc_i28
  DEVICE_NAME: sp9820e_xtc_i28
  MAKEFILE_NAME: omni_sp9820e_xtc_i28

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    env:
      LC_ALL: "C.UTF-8"
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXEC: /usr/bin/ccache

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Prepare the environment
      run: |
        sudo apt -qq update
        sudo apt -y -qq upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev libx11-dev tree \
          lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          python3 zip unzip || true
        sudo apt -y install lib32ncurses-dev libncurses5 || true
        ccache --version | head -n 1

    - name: Install OpenJDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: 补 ncurses5
      run: |
        # clang-4691093 要 libtinfo.so.5，22.04 只有 .so.6
        BASE=http://archive.ubuntu.com/ubuntu/pool/main/n/ncurses
        cd /tmp
        for p in libtinfo5 libncurses5 libncursesw5 lib32tinfo5 lib32ncurses5; do
          f="${p}_6.1-1ubuntu1.18.04.1_amd64.deb"
          curl -fsSL "$BASE/$f" -o "/tmp/$f" && echo "[+] $p" || echo "[!] $p 下载失败"
        done
        sudo dpkg -i /tmp/libtinfo5_*.deb /tmp/libncurses5_*.deb /tmp/libncursesw5_*.deb \
                      /tmp/lib32tinfo5_*.deb /tmp/lib32ncurses5_*.deb || sudo apt -y -f install
        for lib in libtinfo libncurses libncursesw; do
          if [ ! -e "/usr/lib/x86_64-linux-gnu/${lib}.so.5" ]; then
            sudo ln -sf "/lib/x86_64-linux-gnu/${lib}.so.6" "/usr/lib/x86_64-linux-gnu/${lib}.so.5" || true
          fi
        done
        sudo ldconfig
        ls -l /usr/lib/x86_64-linux-gnu/libtinfo.so.5 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>&1 || true
        ls -l /usr/lib32/libtinfo.so.5 /usr/lib32/libncurses.so.5 2>&1 || true

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        repo --version 2>&1 | head -n 3 || true

    - name: Initialize repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "i28-ci"
        git config --global user.email "i28-ci@users.noreply.github.com"
        # twrp-extras.xml 已由 remove-minimal.xml include，default.xml 不用动 ——
        # 手动再 include / 放到 local_manifests 会造成 remove-project 重复执行（non-existent）
        # 和 project 重复添加（duplicate path）
        # -g default,pdk：TeamWin 的 build/make 带 groups="pdk"，不收 pdk 组拉不到
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} -g default,pdk
        ls .repo/manifests/twrp-extras.xml

    - name: 恢复 ccache
      if: ${{ inputs.fresh_ccache == false }}
      uses: actions/cache@v4
      with:
        path: .ccache
        # key 不带 run_id：带 run_id 每次都是唯一 key，精确匹配必然 miss，
        # 只能靠 restore-keys 兜。固定 key 让成功的那次直接命中。
        key: ccache-9.0-${{ env.MANIFEST_BRANCH }}
        restore-keys: |
          ccache-9.0-${{ env.MANIFEST_BRANCH }}-
          ccache-9.0-

    - name: Repo Sync
      run: repo sync -q -j$(nproc --all) --force-sync --no-clone-bundle
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        git clone --depth=1 ${{ env.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
        # 9.0 的 init 是 init.cpp，init.c.patch 打不上，vendorsetup.sh 里的 patch 会卡在交互提问
        sed -i 's|^patch -Np1|# &|' ${{ env.DEVICE_PATH }}/vendorsetup.sh
        grep -n 'patch' ${{ env.DEVICE_PATH }}/vendorsetup.sh || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 设备 rc 注入 + BoardConfig 修正
      run: |
        MK="${{ env.DEVICE_PATH }}/device.mk"
        BC="${{ env.DEVICE_PATH }}/BoardConfig.mk"

        # recovery/root 不会自动进 ramdisk，必须走 PRODUCT_COPY_FILES
        {
          echo ""
          echo "PRODUCT_COPY_FILES += \\"
          echo "    \$(LOCAL_PATH)/recovery/root/init.recovery.sp9820e_xtc_i28.rc:root/init.recovery.sp9820e_xtc_i28.rc \\"
          echo "    \$(LOCAL_PATH)/recovery/root/ueventd.sp9820e_xtc_i28.rc:root/ueventd.sp9820e_xtc_i28.rc"
        } >> "$MK"

        if [ "${{ inputs.DISABLE_BLANK }}" == "true" ]; then
          sed -i 's/^TW_SCREEN_BLANK_ON_BOOT := true/TW_SCREEN_BLANK_ON_BOOT := false/' "$BC"
          grep -q '^TW_SCREEN_BLANK_ON_BOOT' "$BC" || echo 'TW_SCREEN_BLANK_ON_BOOT := false' >> "$BC"
          grep -q '^TW_NO_SCREEN_BLANK' "$BC" || echo 'TW_NO_SCREEN_BLANK := true' >> "$BC"
        fi

        # boot 上限 11.75MB < 实际 11.79MB，按分区表放宽到 14MB
        sed -i 's/^BOARD_BOOTIMAGE_PARTITION_SIZE := .*/BOARD_BOOTIMAGE_PARTITION_SIZE := 14680064/' "$BC"

        grep -nE 'TW_SCREEN_BLANK_ON_BOOT|TW_NO_SCREEN_BLANK|TW_THEME|TW_INPUT_BLACKLIST|PARTITION_SIZE' "$BC" || true
        tail -n 6 "$MK"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync Device Dependencies
      continue-on-error: true
      run: |
        DEP="${{ env.DEVICE_PATH }}/omni.dependencies"
        if [ -f "$DEP" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEP"
          repo sync -q -j$(nproc --all)
        else
          echo "[i] 无 omni.dependencies，跳过"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: ccache 准备
      run: |
        ccache -M 5G
        ccache -z
        CLANG=prebuilts/clang/host/linux-x86/clang-4691093/bin/clang.real
        if [ -x "$CLANG" ]; then
          "$CLANG" --version || { echo "[!] clang.real 起不来"; ldd "$CLANG" | grep -i 'not found' || true; exit 1; }
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 装 Python2
      run: |
        # build/make 脚本是 py2 语法，22.04 无 python2
        BASE=http://archive.ubuntu.com/ubuntu/pool/main/p/python2.7
        V="2.7.17-1~18.04ubuntu1.11"
        cd /tmp
        for p in libpython2.7-minimal libpython2.7-stdlib python2.7-minimal python2.7; do
          f="${p}_${V}_amd64.deb"
          curl -fsSL "$BASE/$f" -o "/tmp/$f" && echo "[+] $p" || echo "[!] $p 下载失败"
        done
        sudo dpkg -i --force-depends /tmp/libpython2.7-*.deb /tmp/python2.7*.deb || true
        sudo ldconfig
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python
        sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python
        python --version 2>&1
        python -c "import sys; sys.exit(0 if sys.version_info[0]==2 else 1)" || { echo "[!] python 不是 2.x"; exit 1; }
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        set -o pipefail
        LOG=/tmp/build.log
        : > "$LOG"
        # source/lunch 必须留在当前 shell：进管道会开子 shell，lunch 函数和 TARGET_* 变量都会丢
        source build/envsetup.sh >>"$LOG" 2>&1 || true
        tail -3 "$LOG"
        export ALLOW_MISSING_DEPENDENCIES=true
        export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation"
        lunch ${{ env.MAKEFILE_NAME }}-eng >>"$LOG" 2>&1 || { echo "[!] lunch 失败"; tail -30 "$LOG"; exit 1; }
        tail -5 "$LOG"
        make clean >>"$LOG" 2>&1 || true
        echo "[i] make 开始：每 1% 一行进度，warning/error 实时输出；完整日志见 build-log artifact"
        if make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee -a "$LOG" | awk '
            BEGIN { last = -1 }
            /^\[ *[0-9]+%/ {
              if (match($0, /\[ *[0-9]+%/)) {
                p = substr($0, RSTART+1, RLENGTH-2) + 0
                if (p != last) { print; last = p }
              }
              next
            }
            /warning:|error:|Error [0-9]|FAILED:|ninja: build stopped|No rule to make/ { print }
          '; then
          echo "[OK] 编译完成，warning $(grep -ci 'warning:' "$LOG" || true) 条"
        else
          echo "=== 失败摘要 ==="
          grep -E "error:|FAILED:|ninja: build stopped|No rule to make" "$LOG" | tail -40 || true
          echo "=== 最后 120 行 ==="
          tail -120 "$LOG"
          exit 1
        fi
        ccache -s || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: 上传编译日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: /tmp/build.log
        if-no-files-found: ignore
        retention-days: 3

    - name: 镜像自检
      continue-on-error: true
      run: |
        IMG=workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        ls -l "$IMG"
        echo "magic     : $(head -c 8 "$IMG")"
        echo "kernel_sz : $(od -An -tu4 -j8  -N4 "$IMG" | tr -d ' ')"
        echo "ramdisk_sz: $(od -An -tu4 -j16 -N4 "$IMG" | tr -d ' ')"
        echo "dt_size   : $(od -An -tu4 -j40 -N4 "$IMG" | tr -d ' ')"
        echo "cyttsp5   : $(grep -a -o cyttsp5 "$IMG" | wc -l) 处"
        echo "tsc@24    : $(grep -a -o 'tsc@24' "$IMG" | wc -l) 处"
        echo "TWRP 版本 : $(grep -a -o 'TWRP 3\.[0-9.]*' "$IMG" | sort -u | tr '\n' ' ')"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.DEVICE_NAME }}-twrp-3.7-${{ github.run_number }}
        path: workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        if-no-files-found: error

    - name: Upload to Release
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        name: ${{ env.DEVICE_NAME }}-twrp-3.7-${{ github.run_number }}
        tag_name: twrp37-${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_URL }} @ ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Device tree: ${{ env.DEVICE_TREE_URL }} - ${{ inputs.DEVICE_TREE_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
          DISABLE_BLANK: ${{ inputs.DISABLE_BLANK }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
